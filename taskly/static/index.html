<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskly</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <h1>Taskly</h1>

    <form id="new-todo" autocomplete="off">
      <input id="new-title" name="title" maxlength="500" placeholder="What needs doing?" required>
      <button type="submit">Add</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <ul id="todos"></ul>
    <p id="empty" class="empty" hidden>Nothing to do. Add something above.</p>
  </main>
</body>
</html>
