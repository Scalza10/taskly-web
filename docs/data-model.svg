<svg xmlns="http://www.w3.org/2000/svg" class="er-svg" viewBox="0 0 1160 700" role="img" aria-label="Taskly's SQLite tables at schema 3: users, sessions, list_members, lists, tasks, and the columns that point from one to another.">
<title>Taskly data model, schema 3</title>
<style>
svg.er-svg {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #e2e8ee; --ink: #16202b; --muted: #586675; --line: #c3cdd7;
  --accent: #1f5fae; --accent-soft: #dbe6f6; --key: #8f5207; --key-soft: #f4e4c8; --cascade: #bf3a26;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  svg.er-svg {
    --bg: #161d25; --surface: #1c242e; --surface-2: #26313c; --ink: #e3e9ef; --muted: #94a2b0; --line: #3a4754;
    --accent: #79aef0; --accent-soft: #1d2f47; --key: #e2b360; --key-soft: #3d3017; --cascade: #f07c66;
  }
}

.t-fill { fill: var(--surface); }
.t-head { fill: var(--surface-2); }
.t-outline { fill: none; stroke: var(--line); stroke-width: 1; }
.t-rule { stroke: var(--line); stroke-width: 1; }
.t-name { font: 600 15px var(--font-body); fill: var(--ink); }
.t-since { font: 500 10.5px var(--font-mono); fill: var(--muted); letter-spacing: .04em; }
.c-bg { fill: transparent; }
.c-name { font: 12.5px var(--font-mono); fill: var(--ink); }
.c-type { font: 11.5px var(--font-mono); fill: var(--muted); }
.c-null { font-style: italic; }
.b-text { font: 600 9.5px var(--font-mono); letter-spacing: .04em; }
.b-pk .b-rect { fill: var(--key-soft); }
.b-pk .b-text { fill: var(--key); }
.b-fk .b-rect { fill: var(--accent-soft); }
.b-fk .b-text { fill: var(--accent); }
.b-uq .b-rect { fill: transparent; stroke: var(--line); }
.b-uq .b-text { fill: var(--muted); }
.t-index { font: 11px var(--font-mono); fill: var(--muted); }
.e-line, .e-mark { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.e-optional .e-line { stroke-dasharray: 5 4; }
.e-cascade .e-line, .e-cascade .e-mark { stroke: var(--cascade); }
.e-hit { fill: none; stroke: transparent; stroke-width: 14; }
.e-label-bg { fill: var(--bg); }
.e-label { font: italic 12px var(--font-body); fill: var(--muted); }
.e-cascade .e-label { fill: var(--cascade); }
.sa-bg { fill: var(--bg); }
.sa-title { font: 600 22px var(--font-body); fill: var(--ink); }
.sa-sub { font: 12px var(--font-mono); fill: var(--muted); }
.sa-legend { font: 12px var(--font-body); fill: var(--muted); }
</style>
